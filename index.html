<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 TGS 福岡進東京出 行程計畫</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="cyber-background"></div>
    <div class="scanlines"></div>

    <header class="header">
        <div class="logo">
            <span class="glitch" data-text="2026 TGS">2026 TGS</span>
            <span class="subtitle">福岡 ➔ 東京 縱貫計畫</span>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" data-target="itinerary-tab">每日行程</button>
            <button class="tab-btn" data-target="checklist-tab">裝備清單</button>
            <button class="tab-btn" data-target="shopping-tab">購物清單</button>
        </nav>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="countdown-container glass-card">
                <h2>出發倒數 (桃園機場報到)</h2>
                <div id="countdown" class="countdown">
                    <div class="time-box"><span id="cd-days">00</span><small>DAYS</small></div><span class="colon">:</span>
                    <div class="time-box"><span id="cd-hours">00</span><small>HRS</small></div><span class="colon">:</span>
                    <div class="time-box"><span id="cd-mins">00</span><small>MIN</small></div><span class="colon">:</span>
                    <div class="time-box"><span id="cd-secs">00</span><small>SEC</small></div>
                </div>
                <div class="target-date">Target: 2026.09.12 09:30:00 (GMT+8)</div>
            </div>
        </section>

        <!-- Itinerary Tab -->
        <section id="itinerary-tab" class="tab-content active">
            <div class="day-selector-container glass-card">
                <div class="day-selector" id="day-selector">
                    <!-- Day buttons generated by JS -->
                </div>
            </div>
            
            <div class="itinerary-display" id="itinerary-display">
                <!-- Itinerary cards generated by JS -->
            </div>
        </section>

        <!-- Checklist Tab -->
        <section id="checklist-tab" class="tab-content">
            <div class="checklist-container glass-card">
                <h2>裝備確認清單 / Equipment Checklist</h2>
                <div class="progress-container">
                    <div class="progress-bar" id="checklist-progress"></div>
                </div>
                <div class="checklist-categories" id="checklist-categories">
                    <!-- Checklists generated by JS -->
                </div>
            </div>
        </section>

        <!-- Shopping Tab -->
        <section id="shopping-tab" class="tab-content">
            <div class="shopping-container glass-card">
                <h2>戰利品與購物清單 / Shopping List</h2>
                <div class="shopping-grid" id="shopping-list">
                    <!-- Shopping items generated by JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
